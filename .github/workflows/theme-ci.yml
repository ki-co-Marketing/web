name: Urban CMS Theme CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "claude/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. PHP Syntax Check ────────────────────────────────────────────────────
  php-lint:
    name: PHP Syntax (php -l)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none

      - name: Lint all PHP files
        run: |
          ERRORS=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              php -l "$file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find urban-cms -name "*.php" -print0)
          echo "Linted $(find urban-cms -name '*.php' | wc -l) files — ${ERRORS} error(s)"
          exit $ERRORS

  # ─── 2. Block JSON Validation ───────────────────────────────────────────────
  validate-blocks:
    name: Validate block.json files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: |
          ERRORS=0
          for f in $(find urban-cms/blocks -name "block.json" 2>/dev/null); do
            if python3 -c "import json, sys; json.load(open('$f'))" 2>/dev/null; then
              echo "✓  $f"
            else
              echo "✗  $f — invalid JSON"
              ERRORS=$((ERRORS + 1))
            fi
          done
          exit $ERRORS

      - name: Check required block.json fields
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          required = ["name", "title", "category", "editorScript"]
          errors = []
          for root, dirs, files in os.walk("urban-cms/blocks"):
              for fname in files:
                  if fname != "block.json":
                      continue
                  path = os.path.join(root, fname)
                  data = json.load(open(path))
                  for key in required:
                      if key not in data:
                          errors.append(f"{path}: missing required field '{key}'")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"All block.json files have required fields ✓")
          PYEOF

  # ─── 3. WordPress Coding Standards (PHPCS) ──────────────────────────────────
  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: phpcs-${{ hashFiles('composer.lock') }}
          restore-keys: phpcs-

      - name: Install PHPCS + WordPress Coding Standards
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPCS
        run: vendor/bin/phpcs --standard=.phpcs.xml.dist

  # ─── 4. Theme Header Validation ─────────────────────────────────────────────
  theme-header:
    name: Validate theme header (style.css)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required WordPress theme headers
        run: |
          python3 - <<'PYEOF'
          import re, sys

          REQUIRED = ["Theme Name", "Version", "Description", "Author", "Text Domain"]
          content = open("urban-cms/style.css").read(4096)

          missing = [h for h in REQUIRED if not re.search(rf"^{h}:", content, re.MULTILINE)]
          if missing:
              print("style.css is missing required theme headers:")
              for h in missing:
                  print(f"  - {h}:")
              sys.exit(1)
          print("All required theme headers present in style.css ✓")
          PYEOF

  # ─── Summary gate ────────────────────────────────────────────────────────────
  ci-pass:
    name: CI passed
    needs: [php-lint, validate-blocks, phpcs, theme-header]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -q '"result": "failure"'; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI checks passed ✓"
